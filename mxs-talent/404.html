<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta name="referrer" content="no-referrer">
  <link rel="apple-touch-icon" href="images/Favicon_mxs_64p_V02.png">
  <title>Seite nicht gefunden (404) · mXs Talent Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --accent: #e8781e;
      --btn-fg: #090a0f;
      --radius-sm: 4px;
      --radius-md: 8px;
    }
    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: clip;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    :where(a, button):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .err-header {
      width: 100%;
      background: #f7f7f4;
      color: #0f172a;
      border-bottom: 1px solid #e2e8f0;
    }
    .err-header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .err-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #0f172a;
      min-height: 44px;
    }
    .err-brand-name {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      color: #0f172a;
    }
    .err-logo-img {
      max-height: 38px;
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
    }
    .err-hdr-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      color: #0f172a;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .err-hdr-link:hover { text-decoration: underline; text-underline-offset: 3px; }
    .err-main {
      width: 100%;
      flex: 1 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    .err-section {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }
    .err-card {
      max-width: 560px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    .err-badge {
      display: inline-block;
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius-sm);
      padding: 4px 10px;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    h1 {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.2;
      color: var(--text);
      margin-bottom: 12px;
    }
    .err-desc {
      color: var(--muted);
      font-size: 0.98rem;
      margin: 0 auto 24px;
      max-width: 440px;
    }
    .err-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .err-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 11px 20px;
      border-radius: var(--radius-md);
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-size: 0.94rem;
      font-weight: 700;
      text-decoration: none;
    }
    .err-btn-primary {
      background: var(--accent);
      color: var(--btn-fg);
      border: 1px solid var(--accent);
    }
    .err-btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .err-footer {
      width: 100%;
      border-top: 1px solid var(--border);
      padding: 18px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.84rem;
    }
  </style>
</head>
<body>
  <header class="err-header">
    <div class="err-header-inner">
      <a href="./" class="err-brand" aria-label="mXs Talent Solutions Startseite">
        <img src="images/mxs_Talensolutions_Logo_new_2._HP-Header_ausgerichtet_Green_Talent_V04.png" alt="mXs Talent Solutions" width="1786" height="533" class="err-logo-img" decoding="async">
      </a>
      <a href="./" class="err-hdr-link">Startseite</a>
    </div>
  </header>

  <main id="main-content" class="err-main">
    <section class="err-section" aria-label="Fehlermeldung 404">
      <div class="err-card">
        <div class="err-badge">Fehler 404 · Seite nicht gefunden</div>
        <h1>Diese Seite wurde nicht gefunden</h1>
        <p class="err-desc">Die aufgerufene Adresse bei mXs Talent Solutions existiert nicht oder wurde verschoben. Über die Startseite gelangen Sie direkt zurück zur Übersicht.</p>
        <div class="err-actions">
          <a class="err-btn err-btn-primary" href="./">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            <span>Zur Startseite</span>
          </a>
        <a class="err-btn err-btn-secondary" href="strategie-kennen-lernen.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <span>Strategie kennenlernen</span>
        </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="err-footer">
    magnet-Xs gmbh · 4800 Zofingen
  </footer>
</body>
</html>
